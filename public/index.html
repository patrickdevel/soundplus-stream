<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mein SoundCloud</title>
<style>
:root{--bg:#f6f6f7;--card:#fff;--fg:#1b1b1f;--mute:#76767f;--line:#e4e4e8;--acc:#ff5500}
@media(prefers-color-scheme:dark){:root{--bg:#121214;--card:#1c1c20;--fg:#f2f2f4;--mute:#9a9aa5;--line:#2b2b31}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif;padding-bottom:110px}
header{position:sticky;top:0;background:var(--bg);padding:14px 16px;border-bottom:1px solid var(--line);z-index:5}
.wrap{max-width:820px;margin:0 auto}
h1{font-size:18px;margin:0 0 10px}h1 span{color:var(--acc)}
form{display:flex;gap:8px}
input{flex:1;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:15px}
button{cursor:pointer;border:0;border-radius:10px;background:var(--acc);color:#fff;padding:0 18px;font-weight:600;font-size:15px}
.hint{color:var(--mute);font-size:12.5px;margin-top:6px}
main{padding:16px}
.head{display:flex;gap:16px;align-items:center;margin-bottom:16px}
.head img{width:96px;height:96px;border-radius:12px;object-fit:cover;background:var(--line)}
.head h2{margin:0 0 4px;font-size:20px}.head p{margin:0;color:var(--mute);font-size:13.5px}
.row{display:flex;gap:12px;align-items:center;padding:10px;border-radius:12px;background:var(--card);margin-bottom:8px;cursor:pointer;border:1px solid transparent}
.row:hover{border-color:var(--line)}.row.on{border-color:var(--acc)}
.row img{width:52px;height:52px;border-radius:8px;object-fit:cover;background:var(--line);flex:none}
.row div{min-width:0;flex:1}.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s{color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d{color:var(--mute);font-size:13px;flex:none}
.msg{color:var(--mute);text-align:center;padding:40px 0}.err{color:#d33}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px;display:none}
#bar .wrap{display:flex;gap:12px;align-items:center}
#bar img{width:48px;height:48px;border-radius:8px;object-fit:cover}
#bar .info{flex:1;min-width:0}
.ctl button{width:38px;height:38px;padding:0;border-radius:50%;font-size:15px}
.ctl .g{background:var(--line);color:var(--fg)}
.seek{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mute);margin-top:4px}
.seek input{padding:0;accent-color:var(--acc)}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>Mein <span>SoundCloud</span></h1>
  <form id="f"><input id="q" placeholder="Suchen oder SoundCloud-Link einfügen…" autofocus><button>Los</button></form>
  <div class="hint">Suchbegriff · Track-Link · Playlist-Link (/sets/) · Profil-Link oder @benutzername</div>
</div></header>
<main><div class="wrap" id="out"><div class="msg">Such etwas, um loszulegen.</div></div></main>

<div id="bar"><div class="wrap">
  <img id="bi" alt="">
  <div class="info"><div class="t" id="bt"></div><div class="s" id="ba"></div>
    <div class="seek"><span id="cur">0:00</span><input type="range" id="sk" min="0" max="1000" value="0" style="flex:1"><span id="dur">0:00</span></div></div>
  <div class="ctl" style="display:flex;gap:6px">
    <button class="g" id="prev" title="Zurück">⏮</button><button id="pp">▶</button><button class="g" id="next" title="Weiter">⏭</button>
  </div>
</div></div>
<audio id="au"></audio>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
const $=s=>document.querySelector(s), out=$('#out'), au=$('#au');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=ms=>{const s=Math.floor((ms||0)/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const api=async(p,params)=>{
  const r=await fetch('/api/'+p+'?'+new URLSearchParams(params),{headers:{'x-key':sessionStorage.getItem('key')||''}});
  if(r.status===401){const k=prompt('Zugriffscode:');if(k){sessionStorage.setItem('key',k);return api(p,params)}}
  const d=await r.json();if(!r.ok)throw new Error(d.error||'Fehler');return d};
let queue=[],idx=-1,hls=null;

const rows=list=>list.map((t,i)=>`<div class="row" data-i="${i}"><img src="${esc(t.artworkUrl||'')}" alt="" loading="lazy">
  <div><div class="t">${esc(t.title)}</div><div class="s">${esc(t.artist?.username||'')}</div></div><span class="d">${fmt(t.duration)}</span></div>`).join('');

function show(list,head=''){
  queue=list;
  out.innerHTML=head+(list.length?rows(list):'<div class="msg">Nichts gefunden.</div>');
  out.querySelectorAll('.row').forEach(r=>r.onclick=()=>play(+r.dataset.i));
}

$('#f').onsubmit=async e=>{
  e.preventDefault();
  const q=$('#q').value.trim(); if(!q)return;
  out.innerHTML='<div class="msg">Lade…</div>';
  try{
    if(/^https?:\/\//i.test(q)){
      const parts=new URL(q).pathname.split('/').filter(Boolean);
      if(parts[1]==='sets'){
        const p=await api('playlist',{url:q});
        return show(p.tracks||[],`<div class="head"><img src="${esc(p.artworkUrl||'')}" alt=""><div><h2>${esc(p.title)}</h2><p>${p.trackCount} Tracks</p></div></div>`);
      }
      if(parts.length===1) return profile(q);
      return play(-1,await api('track',{url:q}));
    }
    if(q.startsWith('@')) return profile(q.slice(1));
    show(await api('search',{q}));
  }catch(err){out.innerHTML=`<div class="msg err">${esc(err.message)}</div>`}
};

async function profile(u){
  const p=await api('profile',{u});
  const st=p.stats||{};
  out.innerHTML=`<div class="head"><img src="${esc(p.avatarUrl||'')}" alt=""><div><h2>${esc(p.username)}</h2>
    <p>${st.followers??0} Follower · ${st.tracks??0} Tracks</p><p>${esc((p.description||'').slice(0,200))}</p></div></div>
    <div class="hint">Tipp: Track- oder Playlist-Links einfügen, um abzuspielen. Oder suche nach dem Namen.</div>`;
  queue=[];
}

async function play(i,full){
  try{
    let t=full;
    if(i>=0){
      idx=i; const s=queue[i];
      document.querySelectorAll('.row').forEach(r=>r.classList.toggle('on',+r.dataset.i===i));
      $('#bar').style.display='block'; $('#bt').textContent=s.title; $('#ba').textContent='Lade…';
      t=await api('track',{url:s.permalinkUrl});
    } else {idx=-1;$('#bar').style.display='block';}
    $('#bi').src=t.artworkUrl||''; $('#bt').textContent=t.title; $('#ba').textContent=t.artist?.username||'';
    if(hls){hls.destroy();hls=null}
    const u=t.streamUrl;
    if(/\.m3u8/.test(u)&&!au.canPlayType('application/vnd.apple.mpegurl')){
      if(!window.Hls||!Hls.isSupported())throw new Error('HLS wird nicht unterstützt');
      hls=new Hls(); hls.loadSource(u); hls.attachMedia(au);
    } else au.src=u;
    await au.play();
  }catch(err){$('#ba').textContent='Fehler: '+err.message}
}

$('#pp').onclick=()=>au.paused?au.play():au.pause();
$('#next').onclick=()=>idx>=0&&idx<queue.length-1&&play(idx+1);
$('#prev').onclick=()=>idx>0&&play(idx-1);
au.onplay=()=>$('#pp').textContent='⏸'; au.onpause=()=>$('#pp').textContent='▶';
au.onended=()=>$('#next').onclick();
au.ontimeupdate=()=>{if(au.duration){$('#sk').value=au.currentTime/au.duration*1000;$('#cur').textContent=fmt(au.currentTime*1000);$('#dur').textContent=fmt(au.duration*1000)}};
$('#sk').oninput=e=>{if(au.duration)au.currentTime=e.target.value/1000*au.duration};
</script>
</body>
</html>

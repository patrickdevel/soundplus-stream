<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mein SoundCloud</title>
<style>
:root{--bg:#fff;--bg2:#f2f2f2;--fg:#333;--mute:#999;--line:#e5e5e5;--acc:#f50;--nav:#333}
@media(prefers-color-scheme:dark){:root{--bg:#161616;--bg2:#222;--fg:#eee;--mute:#8a8a8a;--line:#2e2e2e;--nav:#000}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 Helvetica,Arial,sans-serif;padding-bottom:90px}
a{color:inherit;text-decoration:none}a:hover{color:var(--acc)}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
nav{position:sticky;top:0;z-index:20;height:46px;background:var(--nav);color:#ccc;display:flex;align-items:center;gap:6px;padding:0 12px}
nav .logo{display:flex;align-items:center;gap:8px;color:#fff;font-weight:700;padding-right:12px;white-space:nowrap}
nav .lk{padding:0 16px;height:46px;display:flex;align-items:center}nav .lk.on{background:#111;color:#fff}nav .lk:hover{color:#fff}
nav form{flex:1;max-width:520px;margin:0 auto}
nav input{width:100%;height:28px;border:0;border-radius:4px;padding:0 10px;background:#f2f2f2;color:#333;font-size:14px}
nav .ib{color:#ccc;padding:0 12px;height:46px}nav .ib:hover{color:#fff}
#view{max-width:1100px;margin:0 auto;padding:24px 20px}
h2{font-size:20px;font-weight:400;margin:28px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.chip{padding:4px 12px;border:1px solid var(--line);border-radius:14px;font-size:13px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:18px 0 10px}
.tabs a{padding:8px 0;font-size:16px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a.on{border-color:var(--acc);color:var(--fg);font-weight:700}
.tr{display:flex;align-items:center;gap:12px;padding:8px 6px;border-bottom:1px solid var(--line);cursor:pointer}
.tr:hover{background:var(--bg2)}.tr.on .t{color:var(--acc)}
.tr img,.ph{width:56px;height:56px;object-fit:cover;background:var(--bg2);flex:none}
.tr .m{flex:1;min-width:0}.t{font-size:15px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a{color:var(--mute);font-size:13px}.pl,.du{color:var(--mute);font-size:12px;flex:none;min-width:44px;text-align:right}
.ic{padding:5px 8px;border:1px solid var(--line);border-radius:3px;font-size:13px;color:var(--mute);flex:none}
.ic:hover{color:var(--fg);border-color:var(--mute)}.ic.liked{color:var(--acc);border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px}
.card{cursor:pointer;display:block}.card .im{position:relative;aspect-ratio:1;background:var(--bg2);overflow:hidden}
.card.pr .im{border-radius:50%}.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .go{position:absolute;right:8px;bottom:8px;width:38px;height:38px;border-radius:50%;background:var(--acc);color:#fff;display:none;align-items:center;justify-content:center}
.card:hover .go{display:flex}.card .t{font-size:14px;margin-top:6px}.card.pr{text-align:center}
.hero{display:flex;gap:24px;padding:24px;background:linear-gradient(135deg,#8a8a8a,#3a3a3a);color:#fff;align-items:flex-end;flex-wrap:wrap;background-size:cover;background-position:center}
.hero img{width:200px;height:200px;object-fit:cover;box-shadow:0 2px 12px #0006}.hero.pf img{border-radius:50%}
.hero h1{font-size:26px;margin:0 0 4px;font-weight:700;background:#000a;display:inline-block;padding:2px 8px}
.hero .sub{margin:6px 0 0}.hero .sub span{background:#000a;padding:1px 8px;display:inline-block;font-size:13px}
.hero .box{flex:1;min-width:220px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{background:var(--acc);color:#fff;padding:8px 18px;border-radius:3px;font-weight:700}.btn:hover{background:#e04800;color:#fff}
.btn.g{background:#fff;color:#333;border:1px solid var(--line)}.btn.g:hover{color:var(--acc);background:#fff}
.btn.on{background:#fff;color:var(--acc)}
.bio{white-space:pre-wrap;max-width:720px;line-height:1.6}
.msg{color:var(--mute);padding:40px 0;text-align:center}.err{color:#d33}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:30;height:56px;background:var(--bg);border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 12px}
#bar .c{display:flex;align-items:center}
#bar .c button{width:34px;height:34px;font-size:15px;color:var(--mute)}#bar .c button.on{color:var(--acc)}
#bar .c #pp{color:var(--acc);font-size:20px}
#wv{flex:1;height:34px;min-width:60px;cursor:pointer;display:block}
.tm{font-size:11px;color:var(--mute);min-width:34px;text-align:center}
#vol{width:70px;accent-color:var(--acc)}
#np{display:flex;align-items:center;gap:8px;width:230px;min-width:0}
#np img{width:38px;height:38px;object-fit:cover;background:var(--bg2);flex:none}
#np div{min-width:0}#np .t{font-size:13px}
#qp{position:fixed;right:0;top:46px;bottom:56px;width:340px;max-width:100%;background:var(--bg);border-left:1px solid var(--line);z-index:25;overflow:auto;display:none;padding:6px 12px}
#qp.open{display:block}#qp h3{margin:10px 0;font-size:16px;font-weight:400;display:flex;justify-content:space-between}
#qp .tr img{width:40px;height:40px}
#menu{position:fixed;z-index:50;background:var(--bg);border:1px solid var(--line);box-shadow:0 4px 16px #0003;min-width:200px;display:none;padding:4px 0}
#menu button{display:block;width:100%;text-align:left;padding:8px 14px}#menu button:hover{background:var(--bg2);color:var(--acc)}
#toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:#333;color:#fff;padding:8px 16px;border-radius:4px;z-index:60;display:none}
@media(max-width:760px){#np{width:44px}#np div,#vol,.tm,nav .logo b,.pl{display:none}nav .lk{padding:0 8px}.hero img{width:130px;height:130px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<nav>
  <a class="logo" href="#/home"><svg width="34" height="20" viewBox="0 0 34 20"><path fill="#f50" d="M27 19H9V4.5C10.2 3.7 11.6 3.3 13 3.3c3.3 0 6 2.2 6.8 5.2.5-.2 1-.3 1.5-.3 2.5 0 4.5 2 4.5 4.5 0 .3 0 .5-.1.8 1.5.2 2.8 1.5 2.8 3.2 0 1.7-1.6 2.3-3.5 2.3z"/><path stroke="#f50" stroke-width="1.5" d="M1 17v-4M4 18V10M7 18V7"/></svg><b>Mein SoundCloud</b></a>
  <a class="lk" href="#/home" id="n-home">Start</a><a class="lk" href="#/library/likes" id="n-lib">Bibliothek</a>
  <form id="sf"><input id="q" placeholder="Suchen oder SoundCloud-Link einfügen" aria-label="Suche"></form>
  <button class="ib" id="qb" title="Warteschlange">☰ Warteschlange</button>
</nav>
<div id="view"></div>
<aside id="qp"></aside>
<div id="menu"></div><div id="toast"></div>
<div id="bar">
  <div class="c"><button id="pv" title="Zurück">⏮</button><button id="pp" title="Abspielen">▶</button><button id="nx" title="Weiter">⏭</button>
  <button id="sh" title="Zufall">⇄</button><button id="rp" title="Wiederholen">↻</button></div>
  <span class="tm" id="cu">0:00</span><canvas id="wv"></canvas><span class="tm" id="du">0:00</span>
  <input type="range" id="vol" min="0" max="1" step="0.01" aria-label="Lautstärke">
  <div id="np"><img id="ni" alt=""><div><a class="t" id="nt">Nichts spielt</a><a class="a" id="na"></a></div></div>
  <button class="ic" id="nl" data-act="likecur" title="Gefällt mir">♥</button>
</div>
<audio id="au"></audio>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
const $=(s,e=document)=>e.querySelector(s), au=$('#au'), view=$('#view');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc=encodeURIComponent, tm=ms=>{const s=Math.floor((ms||0)/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const num=v=>v==null?'':v>=1e6?(v/1e6).toFixed(1).replace('.',',')+' Mio.':v>=1e3?(v/1e3).toFixed(1).replace('.',',')+' Tsd.':v;
let S={likes:[],lists:{},hist:[],follow:[],vol:.8,shuf:false,rep:0};
try{Object.assign(S,JSON.parse(localStorage.getItem('sc')||'{}'))}catch{}
const save=()=>{try{localStorage.setItem('sc',JSON.stringify(S))}catch{}};
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2500)};
const api=async(p,q)=>{
  const r=await fetch('/api/'+p+'?'+new URLSearchParams(q),{headers:{'x-key':sessionStorage.getItem('key')||''}});
  if(r.status===401){const k=prompt('Zugriffscode:');if(k){sessionStorage.setItem('key',k);return api(p,q)}}
  const d=await r.json().catch(()=>({error:'Ungültige Antwort'}));if(!r.ok)throw new Error(d.error||'Fehler');return d};
const TR={}, LISTS={};
const slim=t=>({id:t.id,title:t.title,permalinkUrl:t.permalinkUrl,duration:t.duration,artworkUrl:t.artworkUrl,artist:t.artist?{id:t.artist.id,username:t.artist.username,profileUrl:t.artist.profileUrl}:null,stats:{plays:t.stats?.plays}});
const reg=l=>l.filter(Boolean).map(t=>(TR[t.id]=Object.assign(TR[t.id]||{},t)));
const liked=id=>S.likes.some(t=>t.id==id);
const img=(u,c='')=>u?`<img class="${c}" src="${esc(u)}" alt="" loading="lazy">`:`<div class="ph ${c}"></div>`;
const pLink=a=>a?`#/profile/${enc(a.profileUrl||a.username)}`:'#';

/* ---------- Listen ---------- */
function rows(list,k){list=reg(list);LISTS[k]=list;
  return list.length?list.map((t,i)=>`<div class="tr${cur&&cur.id==t.id?' on':''}" data-k="${k}" data-i="${i}" data-id="${t.id}">${img(t.artworkUrl)}
  <div class="m"><a class="t" href="#/track/${enc(t.permalinkUrl)}">${esc(t.title)}</a><a class="a" href="${pLink(t.artist)}">${esc(t.artist?.username||'')}</a></div>
  <span class="pl">${t.stats?.plays!=null?'▶ '+num(t.stats.plays):''}</span>
  <button class="ic${liked(t.id)?' liked':''}" data-act="like" title="Gefällt mir">♥</button><button class="ic" data-act="more" title="Mehr">⋯</button>
  <span class="du">${tm(t.duration)}</span></div>`).join(''):'<div class="msg">Hier ist noch nichts.</div>'}
function cards(list,k){list=reg(list);LISTS[k]=list;
  return `<div class="grid">${list.map((t,i)=>`<div class="card" data-k="${k}" data-i="${i}" data-id="${t.id}">
  <div class="im">${img(t.artworkUrl)}<span class="go">▶</span></div><a class="t" href="#/track/${enc(t.permalinkUrl)}">${esc(t.title)}</a><a class="a" href="${pLink(t.artist)}">${esc(t.artist?.username||'')}</a></div>`).join('')}</div>`}
const listCards=l=>`<div class="grid">${l.map(p=>`<a class="card" href="#/playlist/${enc(p.permalinkUrl)}"><div class="im">${img(p.artworkUrl)}</div><span class="t">${esc(p.title)}</span><span class="a">${esc(p.artist?.username||'')} · ${p.trackCount} Tracks</span></a>`).join('')}</div>`;
const userCards=l=>`<div class="grid">${l.map(u=>`<a class="card pr" href="#/profile/${enc(u.permalinkUrl)}"><div class="im">${img(u.avatarUrl)}</div><span class="t">${esc(u.username)}${u.verified?' ✔':''}</span><span class="a">${num(u.followers)} Follower</span></a>`).join('')}</div>`;
const tabs=(base,items,on)=>`<div class="tabs">${items.map(([k,l])=>`<a href="#/${base}/${k}" class="${on===k?'on':''}">${l}</a>`).join('')}</div>`;
const playBtns=k=>`<div class="btns"><button class="btn" data-act="playall" data-k="${k}">▶ Abspielen</button><button class="btn g" data-act="shufall" data-k="${k}">⇄ Zufall</button></div>`;
const load=async(el,fn)=>{el.innerHTML='<div class="msg">Lade…</div>';try{el.innerHTML=await fn()}catch(e){el.innerHTML=`<div class="msg err">${esc(e.message)}</div>`}};

/* ---------- Seiten ---------- */
const GEN=[['all-music','Alle'],['hiphoprap','Hip-Hop'],['electronic','Electronic'],['pop','Pop'],['danceedm','Dance & EDM'],['house','House'],['techno','Techno'],['trap','Trap'],['rbsoul','R&B'],['ambient','Ambient']];
async function vHome(g='all-music',kind='trending'){
  let h='';
  if(S.hist.length)h+=`<h2>Zuletzt gehört</h2>`+cards(S.hist.slice(0,8),'hist');
  h+=`<h2>Charts</h2><div class="chips">${[['trending','Trending'],['top','Top 30']].map(([k,l])=>`<a class="chip${kind===k?' on':''}" href="#/home/${g}/${k}">${l}</a>`).join('')}</div>
  <div class="chips">${GEN.map(([k,l])=>`<a class="chip${g===k?' on':''}" href="#/home/${k}/${kind}">${l}</a>`).join('')}</div><div id="ch"></div>`;
  view.innerHTML=h;
  load($('#ch'),async()=>{const l=await api('explore',{type:'trending',genre:g,kind});return playBtns('ch').replace('class="btns"','class="btns" style="margin:0 0 10px"')+rows(l,'ch')});
}
async function vSearch(q,tab='tracks'){
  view.innerHTML=`<h2 style="margin-top:0">Ergebnisse für „${esc(q)}“</h2>`+tabs('search/'+enc(q),[['tracks','Tracks'],['playlists','Playlists'],['people','Profile']],tab)+'<div id="r"></div>';
  load($('#r'),async()=>{
    if(tab==='tracks')return rows(await api('search',{q}),'s');
    if(tab==='playlists')return listCards(await api('explore',{type:'playlists',q}));
    return userCards(await api('explore',{type:'users',q}));});
}
async function vProfile(u,tab='tracks'){
  view.innerHTML='<div class="msg">Lade…</div>';
  const p=await api('profile',{u}), st=p.stats||{}, f=S.follow.some(x=>x.id==p.id), loc=[p.location?.city,p.location?.country].filter(Boolean).join(', ');
  const bg=p.headerUrl?`style="background-image:linear-gradient(#0003,#0008),url('${esc(p.headerUrl)}')"`:'';
  const base='profile/'+enc(u);
  view.innerHTML=`<div class="hero pf" ${bg}>${img(p.avatarUrl)}<div class="box"><h1>${esc(p.username)}${p.badges?.verified?' ✔':''}</h1>
  <div class="sub"><span>${esc(p.fullName||'')}${loc?' · '+esc(loc):''}</span></div>
  <div class="sub"><span>${num(st.followers)} Follower · ${num(st.following)} Folge ich · ${num(st.tracks)} Tracks</span></div>
  <div class="btns"><button class="btn${f?' on':''}" data-act="follow" data-p='${esc(JSON.stringify({id:p.id,username:p.username,permalinkUrl:p.permalinkUrl,avatarUrl:p.avatarUrl}))}'>${f?'✓ Folge ich':'Folgen'}</button>
  <a class="btn g" href="${esc(p.permalinkUrl)}" target="_blank" rel="noopener">Auf SoundCloud</a></div></div></div>`+
  tabs(base,[['tracks','Tracks'],['playlists','Playlists'],['info','Info']],tab)+'<div id="r"></div>';
  load($('#r'),async()=>{
    if(tab==='tracks'){const l=await api('explore',{type:'user_tracks',id:p.id});return playBtns('pt')+rows(l,'pt')}
    if(tab==='playlists')return listCards(await api('explore',{type:'user_playlists',id:p.id}))||'';
    return `<p class="bio">${esc(p.description||'Keine Beschreibung.')}</p>`+(p.webProfiles?.length?`<h2>Links</h2>`+p.webProfiles.map(w=>`<div><a href="${esc(w.url)}" target="_blank" rel="noopener">${esc(w.title||w.network)}</a></div>`).join(''):'');});
}
async function vPlaylist(url){
  view.innerHTML='<div class="msg">Lade…</div>';
  const p=await api('playlist',{url}), tr=(p.tracks||[]).filter(Boolean);
  reg(tr);LISTS.pl=tr;
  view.innerHTML=`<div class="hero">${img(p.artworkUrl)}<div class="box"><h1>${esc(p.title)}</h1><div class="sub"><span>Playlist von <a href="${pLink({profileUrl:p.curator?.profileUrl})}">${esc(p.curator?.username)}</a> · ${p.trackCount} Tracks · ${tm(p.duration)}</span></div>
  <div class="btns"><button class="btn" data-act="playall" data-k="pl">▶ Abspielen</button><button class="btn g" data-act="shufall" data-k="pl">⇄ Zufall</button>
  <button class="btn g" data-act="savelist" data-name="${esc(p.title)}">Als eigene Playlist speichern</button></div></div></div>`+(p.description?`<p class="bio">${esc(p.description)}</p>`:'')+rows(tr,'pl');
}
async function vTrack(url){
  view.innerHTML='<div class="msg">Lade…</div>';
  const t=await api('track',{url});t.permalinkUrl=t.permalinkUrl||url;
  const s=reg([t])[0];s.streamUrl=t.streamUrl;LISTS.tk=[s];
  view.innerHTML=`<div class="hero" data-id="${t.id}">${img(t.artworkUrl)}<div class="box"><h1>${esc(t.title)}</h1><div class="sub"><span><a href="${pLink(t.artist)}">${esc(t.artist?.username)}</a>${t.genre?' · '+esc(t.genre):''}</span></div>
  <div class="sub"><span>▶ ${num(t.stats?.plays)} · ♥ ${num(t.stats?.likes)} · ${tm(t.duration)}</span></div>
  <div class="btns"><button class="btn" data-act="playall" data-k="tk">▶ Abspielen</button><button class="btn g${liked(t.id)?' liked':''}" data-act="like">♥ Gefällt mir</button><button class="btn g" data-act="more">⋯</button></div></div></div>
  ${t.description?`<p class="bio">${esc(t.description)}</p>`:''}<h2>Ähnliche Tracks</h2><div id="r"></div>`;
  load($('#r'),async()=>rows(await api('explore',{type:'related',id:t.id}),'rel'));
}
function vLibrary(tab='likes'){
  const n=Object.keys(S.lists).length;
  let h=`<h2 style="margin-top:0">Deine Bibliothek</h2>`+tabs('library',[['likes','Likes'],['lists','Playlists'],['hist','Verlauf'],['follow','Folge ich']],tab);
  if(tab==='likes')h+=S.likes.length?playBtns('lk')+rows(S.likes,'lk'):'<div class="msg">Tippe bei einem Track auf ♥, dann erscheint er hier.</div>';
  if(tab==='lists')h+=`<div class="btns" style="margin:0 0 14px"><button class="btn" data-act="newlist">+ Neue Playlist</button></div>`+(n?`<div class="grid">${Object.entries(S.lists).map(([k,l])=>`<a class="card" href="#/mylist/${enc(k)}"><div class="im">${img(l[0]?.artworkUrl)}</div><span class="t">${esc(k)}</span><span class="a">${l.length} Tracks</span></a>`).join('')}</div>`:'<div class="msg">Noch keine Playlists. Füge Tracks über ⋯ hinzu.</div>');
  if(tab==='hist')h+=S.hist.length?`<div class="btns" style="margin:0 0 10px"><button class="btn g" data-act="clearhist">Verlauf löschen</button></div>`+rows(S.hist,'hi'):'<div class="msg">Noch nichts gehört.</div>';
  if(tab==='follow')h+=S.follow.length?userCards(S.follow):'<div class="msg">Du folgst noch niemandem. Das Folgen wird nur lokal gespeichert.</div>';
  view.innerHTML=h;
}
function vMylist(name){
  const l=S.lists[name];if(!l){location.hash='#/library/lists';return}
  view.innerHTML=`<div class="hero">${img(l[0]?.artworkUrl)}<div class="box"><h1>${esc(name)}</h1><div class="sub"><span>${l.length} Tracks · nur auf diesem Gerät</span></div>
  <div class="btns"><button class="btn" data-act="playall" data-k="my">▶ Abspielen</button><button class="btn g" data-act="shufall" data-k="my">⇄ Zufall</button>
  <button class="btn g" data-act="renlist" data-name="${esc(name)}">Umbenennen</button><button class="btn g" data-act="dellist" data-name="${esc(name)}">Löschen</button></div></div></div>`+rows(l,'my');
  view.dataset.list=name;
}

/* ---------- Router ---------- */
async function route(){
  const p=location.hash.replace(/^#\//,'').split('/').map(x=>{try{return decodeURIComponent(x)}catch{return x}});
  view.dataset.list='';window.scrollTo(0,0);
  $('#n-home').classList.toggle('on',!p[0]||p[0]==='home');$('#n-lib').classList.toggle('on',p[0]==='library'||p[0]==='mylist');
  try{
    switch(p[0]){
      case 'search':return await vSearch(p[1]||'',p[2]);
      case 'profile':return await vProfile(p[1],p[2]);
      case 'playlist':return await vPlaylist(p[1]);
      case 'track':return await vTrack(p[1]);
      case 'library':return vLibrary(p[1]);
      case 'mylist':return vMylist(p[1]);
      default:return await vHome(p[1],p[2]);
    }
  }catch(e){view.innerHTML=`<div class="msg err">${esc(e.message)}</div>`}
}
addEventListener('hashchange',route);
$('#sf').onsubmit=e=>{e.preventDefault();const q=$('#q').value.trim();if(!q)return;
  if(/^https?:\/\//i.test(q)){const s=new URL(q).pathname.split('/').filter(Boolean);
    location.hash=s[1]==='sets'?'#/playlist/'+enc(q):s.length===1?'#/profile/'+enc(q):'#/track/'+enc(q)}
  else if(q[0]==='@')location.hash='#/profile/'+enc(q.slice(1));
  else location.hash='#/search/'+enc(q)+'/tracks'};

/* ---------- Player ---------- */
let Q=[],qi=-1,cur=null,hls=null,tok=0;
const wave={};
function heights(id){if(wave[id])return wave[id];let s=Number(id)||1234,a=[],v=.5;
  for(let i=0;i<150;i++){s=(s*9301+49297)%233280;v=Math.max(.12,Math.min(1,v*.55+(s/233280)*.6));a.push(v)}return wave[id]=a}
function draw(){const c=$('#wv'),d=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;if(!w)return;c.width=w*d;c.height=h*d;
  const x=c.getContext('2d');x.scale(d,d);const hs=heights(cur?.id||0),n=Math.floor(w/3),p=au.duration?au.currentTime/au.duration:0;
  const css=getComputedStyle(document.body);
  for(let i=0;i<n;i++){const v=hs[Math.floor(i/n*hs.length)],bh=Math.max(2,v*h);x.fillStyle=i/n<p?'#f50':(matchMedia('(prefers-color-scheme:dark)').matches?'#555':'#ccc');x.fillRect(i*3,(h-bh)/2,2,bh)}}
async function playQueue(list,i,shuffle){Q=list.filter(Boolean);if(shuffle){Q=Q.slice().sort(()=>Math.random()-.5);i=0}playAt(i)}
async function playAt(i){
  if(i<0||i>=Q.length)return;qi=i;const t=cur=Q[i],my=++tok;
  $('#nt').textContent=t.title;$('#nt').href='#/track/'+enc(t.permalinkUrl);$('#na').textContent=t.artist?.username||'';$('#na').href=pLink(t.artist);$('#ni').src=t.artworkUrl||'';
  syncUI();draw();
  try{
    if(!t.streamUrl){const m=await api('track',{url:t.permalinkUrl});if(my!==tok)return;t.streamUrl=m.streamUrl;t.duration=t.duration||m.duration}
    if(hls){hls.destroy();hls=null}
    const u=t.streamUrl;
    if(/\.m3u8/.test(u)&&!au.canPlayType('application/vnd.apple.mpegurl')){
      if(!window.Hls||!Hls.isSupported())throw new Error('HLS nicht unterstützt');
      hls=new Hls();hls.loadSource(u);hls.attachMedia(au)}else au.src=u;
    await au.play();
    S.hist=[slim(t),...S.hist.filter(x=>x.id!=t.id)].slice(0,50);save();
    if('mediaSession'in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist?.username||'',artwork:t.artworkUrl?[{src:t.artworkUrl,sizes:'500x500'}]:[]});
  }catch(e){if(my===tok){toast('Abspielen fehlgeschlagen: '+e.message);}}
}
async function next(auto){
  if(!Q.length)return;
  if(S.shuf&&Q.length>1){let j;do j=Math.floor(Math.random()*Q.length);while(j===qi);return playAt(j)}
  if(qi<Q.length-1)return playAt(qi+1);
  if(S.rep===1)return playAt(0);
  if(auto&&cur?.id){try{const r=reg(await api('explore',{type:'related',id:cur.id})).filter(t=>!Q.some(x=>x.id==t.id));if(r.length){Q.push(...r);toast('Ähnliche Tracks werden gespielt');return playAt(qi+1)}}catch{}}
}
function prev(){if(au.currentTime>3||qi<=0){au.currentTime=0}else playAt(qi-1)}
function syncUI(){
  $('#pp').textContent=au.paused?'▶':'⏸';$('#sh').classList.toggle('on',S.shuf);$('#rp').classList.toggle('on',S.rep>0);$('#rp').textContent=S.rep===2?'↻¹':'↻';
  $('#nl').classList.toggle('liked',!!cur&&liked(cur.id));
  document.querySelectorAll('[data-id]').forEach(e=>e.classList.toggle('on',!!cur&&e.dataset.id==cur.id&&e.classList.contains('tr')));
  if($('#qp').classList.contains('open'))renderQ();
}
au.onplay=au.onpause=syncUI;
au.onended=()=>S.rep===2?(au.currentTime=0,au.play()):next(true);
au.ontimeupdate=()=>{$('#cu').textContent=tm(au.currentTime*1000);$('#du').textContent=tm((au.duration||cur?.duration/1000||0)*1000);draw()};
$('#wv').onclick=e=>{if(au.duration){const r=e.target.getBoundingClientRect();au.currentTime=(e.clientX-r.left)/r.width*au.duration}};
$('#pp').onclick=()=>cur&&(au.paused?au.play():au.pause());
$('#nx').onclick=()=>next(false);$('#pv').onclick=prev;
$('#sh').onclick=()=>{S.shuf=!S.shuf;save();syncUI()};
$('#rp').onclick=()=>{S.rep=(S.rep+1)%3;save();syncUI()};
$('#vol').value=S.vol;au.volume=S.vol;$('#vol').oninput=e=>{au.volume=S.vol=+e.target.value;save()};
addEventListener('resize',draw);
if('mediaSession'in navigator){const m=navigator.mediaSession;m.setActionHandler('play',()=>au.play());m.setActionHandler('pause',()=>au.pause());m.setActionHandler('nexttrack',()=>next(false));m.setActionHandler('previoustrack',prev)}
addEventListener('keydown',e=>{if(/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;
  if(e.code==='Space'){e.preventDefault();$('#pp').click()}
  else if(e.key==='ArrowRight'){e.shiftKey?next(false):au.currentTime+=10}
  else if(e.key==='ArrowLeft'){e.shiftKey?prev():au.currentTime-=10}});

/* ---------- Warteschlange ---------- */
function renderQ(){
  const up=Q.slice(qi+1);
  $('#qp').innerHTML=`<h3>Warteschlange<button class="ic" data-act="clearq">Leeren</button></h3>`+(cur?`<div class="a">Spielt gerade</div><div class="tr on" data-id="${cur.id}">${img(cur.artworkUrl)}<div class="m"><span class="t">${esc(cur.title)}</span><span class="a">${esc(cur.artist?.username||'')}</span></div></div>`:'')+
  (up.length?`<div class="a" style="margin-top:10px">Als Nächstes</div>`+up.map((t,i)=>`<div class="tr" data-qi="${qi+1+i}">${img(t.artworkUrl)}<div class="m"><span class="t">${esc(t.title)}</span><span class="a">${esc(t.artist?.username||'')}</span></div><button class="ic" data-act="rmq" data-qi="${qi+1+i}">✕</button></div>`).join(''):'<div class="msg">Nichts mehr in der Warteschlange.</div>');
}
$('#qb').onclick=()=>{$('#qp').classList.toggle('open');renderQ()};

/* ---------- Menü & Aktionen ---------- */
const menu=$('#menu');
function showMenu(x,y,items){menu.innerHTML='';items.forEach(([l,fn])=>{const b=document.createElement('button');b.textContent=l;b.onclick=e=>{e.stopPropagation();menu.style.display='none';fn()};menu.appendChild(b)});
  menu.style.display='block';menu.style.left=Math.min(x,innerWidth-menu.offsetWidth-8)+'px';menu.style.top=Math.min(y,innerHeight-menu.offsetHeight-8)+'px'}
function addToList(t,x,y){const names=Object.keys(S.lists);
  showMenu(x,y,[['+ Neue Playlist…',()=>{const n=prompt('Name der Playlist:');if(n?.trim()){S.lists[n.trim()]=[...(S.lists[n.trim()]||[]),slim(t)];save();toast('Hinzugefügt')}}],
  ...names.map(n=>[n,()=>{if(!S.lists[n].some(x=>x.id==t.id))S.lists[n].push(slim(t));save();toast('Zu „'+n+'“ hinzugefügt')}])])}
function toggleLike(t){if(!t)return;if(liked(t.id))S.likes=S.likes.filter(x=>x.id!=t.id);else S.likes.unshift(slim(t));save();
  document.querySelectorAll(`[data-id="${t.id}"] [data-act^=like]`).forEach(b=>b.classList.toggle('liked',liked(t.id)));syncUI()}
function trackMenu(t,x,y){const my=view.dataset.list;
  showMenu(x,y,[['Als Nächstes spielen',()=>{Q.splice(qi+1,0,t);if(!cur)playAt(0);toast('Wird als Nächstes gespielt');syncUI()}],
  ['Zur Warteschlange',()=>{Q.push(t);if(!cur)playAt(0);toast('Zur Warteschlange hinzugefügt');syncUI()}],
  ['Zu Playlist hinzufügen…',()=>addToList(t,x,y)],
  ...(t.artist?[['Zum Künstler',()=>location.hash=pLink(t.artist)]]:[]),
  ['Auf SoundCloud öffnen',()=>open(t.permalinkUrl,'_blank','noopener')],
  ...(my?[['Aus dieser Playlist entfernen',()=>{S.lists[my]=S.lists[my].filter(x=>x.id!=t.id);save();vMylist(my)}]]:[])])}
const ACT={
  like:b=>toggleLike(TR[b.closest('[data-id]')?.dataset.id]),
  likecur:()=>toggleLike(cur),
  more:(b,e)=>{const t=TR[b.closest('[data-id]')?.dataset.id];if(t){const r=b.getBoundingClientRect();trackMenu(t,r.left,r.bottom)}},
  playall:b=>playQueue(LISTS[b.dataset.k]||[],0),
  shufall:b=>playQueue(LISTS[b.dataset.k]||[],0,true),
  follow:b=>{const p=JSON.parse(b.dataset.p);const f=S.follow.some(x=>x.id==p.id);S.follow=f?S.follow.filter(x=>x.id!=p.id):[p,...S.follow];save();b.classList.toggle('on',!f);b.textContent=f?'Folgen':'✓ Folge ich'},
  savelist:b=>{S.lists[b.dataset.name]=LISTS.pl.map(slim);save();toast('Gespeichert in der Bibliothek')},
  newlist:()=>{const n=prompt('Name der Playlist:');if(n?.trim()){S.lists[n.trim()]=S.lists[n.trim()]||[];save();vLibrary('lists')}},
  renlist:b=>{const o=b.dataset.name,n=prompt('Neuer Name:',o)?.trim();if(n&&n!==o){S.lists[n]=S.lists[o];delete S.lists[o];save();location.hash='#/mylist/'+enc(n)}},
  dellist:b=>{if(confirm('Playlist „'+b.dataset.name+'“ löschen?')){delete S.lists[b.dataset.name];save();location.hash='#/library/lists'}},
  clearhist:()=>{S.hist=[];save();vLibrary('hist')},
  clearq:()=>{Q=cur?[cur]:[];qi=cur?0:-1;renderQ()},
  rmq:b=>{Q.splice(+b.dataset.qi,1);renderQ()},
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(b){e.preventDefault();e.stopPropagation();ACT[b.dataset.act]?.(b,e);return}
  if(!e.target.closest('#menu'))menu.style.display='none';
  const q=e.target.closest('[data-qi]');if(q&&!e.target.closest('a')){playAt(+q.dataset.qi);return}
  const r=e.target.closest('[data-k]');
  if(r&&!e.target.closest('a')&&!e.target.closest('button')&&r.dataset.i!=null)playQueue(LISTS[r.dataset.k],+r.dataset.i);
});
route();syncUI();
</script>
